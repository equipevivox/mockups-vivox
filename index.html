<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>VIVOX · Portfólio</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=20260909-4" />
<meta name="description" content="Portfólio VIVOX — revistas, folders e mockups." />
<script src="/theme.js?v=20260909-4"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/ui.css?v=20260909-4" />
<link rel="stylesheet" href="/portfolio-background.css?v=20260909-4" />
<link rel="stylesheet" href="/assets/identity.css?v=20260909-4" />
<script src="/assets/brand.js?v=20260909-4" defer></script>
</head>
<body class="pf-page">

  <div class="pf-backdrop" id="pfBackdrop" aria-hidden="true">
    <div class="pf-backdrop-frame">
      <div class="pf-backdrop-matrix" id="pfBackdropMatrix"></div>
    </div>
  </div>

  <header class="topbar pf-topbar">
    <a class="brand" href="/portfolio">
      <img data-brand-motion class="pf-brand-logo" src="/assets/vivox-grid.svg" alt="VIVOX Grid" width="307" height="41" />
      <img data-brand-motion class="pf-brand-logo pf-brand-logo--light" src="/assets/vivox-grid-light.svg" alt="VIVOX Grid" width="307" height="41" />
    </a>
    <button class="ghost-btn theme-toggle" id="themeToggle" type="button" aria-label="Ativar tema claro" title="Ativar tema claro">
      <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
      <span>Tema claro</span>
    </button>
  </header>

  <main class="pf-wrap">
    <section class="pf-head">
      <span class="eyebrow"><span class="eyebrow-dot"></span> MATERIAIS VIVOX</span>
      <h1>Materiais criados para <span class="grad">sua marca</span></h1>
      <p>Explore os materiais desenvolvidos pela VIVOX.<br>Abra cada projeto para visualizar os detalhes, folhear as páginas e deixar seus comentários.</p>
      <div class="pf-filters" id="pfFilters">
        <button class="pf-chip is-on" data-f="todos" aria-pressed="true">Todos</button>
        <button class="pf-chip" data-f="revista" aria-pressed="false">Revistas</button>
        <button class="pf-chip" data-f="folder" aria-pressed="false">Folders</button>
        <button class="pf-chip" data-f="mockup" aria-pressed="false">Mockups</button>
      </div>
    </section>

    <section class="pf-grid" id="pfGrid">
      <div class="pf-loading">Carregando portfólio…</div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/config.js?v=20260909-3"></script>
  <script src="/common.js?v=20260909-3"></script>
  <script src="/portfolio-background.js?v=20260909-3"></script>
  <script src="/portfolio.js?v=20260909-3"></script>
</body>
</html>
